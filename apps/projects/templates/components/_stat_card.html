<!--
    Usage:
    {% include 'components/_stat_card.html' with
        label="Total Plots"
        value=total_count
        color="blue"
    %}
    color options: blue | emerald | amber | slate | red | cyan
-->
<div class="bg-white rounded-xl border border-slate-200 p-5">
    <p class="text-xs font-medium text-slate-400 uppercase tracking-wide">
        {{ label }}
    </p>
    <p class="mt-2 text-3xl font-bold
        {% if color == 'blue' %}text-blue-600
        {% elif color == 'emerald' %}text-emerald-500
        {% elif color == 'amber' %}text-amber-500
        {% elif color == 'red' %}text-red-500
        {% elif color == 'cyan' %}text-cyan-500
        {% else %}text-slate-700{% endif %}">
        {{ value }}
    </p>
    {% if sublabel %}
    <p class="mt-1 text-xs text-slate-400">{{ sublabel }}</p>
    {% endif %}
</div>
