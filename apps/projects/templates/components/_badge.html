
<!--
    Usage: pass 'status' and 'label' variables via include with keyword
    Example: status="AVAILABLE" label="Available"
-->
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
    {% if status == 'AVAILABLE' or status == 'ACTIVE' %}
        bg-emerald-100 text-emerald-700
    {% elif status == 'BOOKED' or status == 'ON_HOLD' %}
        bg-amber-100 text-amber-700
    {% elif status == 'SOLD' or status == 'COMPLETED' %}
        bg-blue-100 text-blue-700
    {% elif status == 'RESERVED' or status == 'PLANNING' %}
        bg-slate-100 text-slate-600
    {% elif status == 'CANCELLED' %}
        bg-red-100 text-red-600
    {% else %}
        bg-slate-100 text-slate-600
    {% endif %}">
    {{ label }}
</span>
